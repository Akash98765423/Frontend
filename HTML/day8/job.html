<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>
<h2>Job Application Form</h2>
<form>
    Full Name:
    <input type="text"><br><br>
    Email:
    <input type="email"><br><br>
    Mobile Number:
    <input type="tel" minlength="10" maxlength="10"><br><br>
    Position Applied:
    <input type="text"><br><br>
    Upload Resume:
    <input type="file"><br><br>
    Experience:
    <input type="number" min="0" max="40"> Years
    <br><br>
    <input type="submit" value="Apply">
</form>
</body>
</html>
