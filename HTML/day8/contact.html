<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

<h2>Contact Form</h2>

<form>
    <label>Name:</label>
    <input type="text"><br><br>
    <label>Email:</label>
    <input type="email"><br><br>
    <label>Mobile no :</label>
    <input type="tel" minlength="10" maxlength="10" ><br><br>
    <label>Address :</label>
    <textarea rows="5" cols="30"></textarea><br><br>
    <input type="submit" value="Send">
</form>

</body>
</html>
