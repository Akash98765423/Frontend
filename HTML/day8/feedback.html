<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
<h2>Feedback Form</h2>
<form>
    Name:
    <input type="text"><br><br>
    Rating:
    <select>
        <option>Excellent</option>
        <option>Good</option>
        <option>Average</option>
        <option>Poor</option>
    </select>
    <br><br>
    Feedback:
    <br>
    <textarea rows="5" cols="30"></textarea>
    <br><br>
    <input type="submit" value="Submit Feedback">
</form>

</body>
</html>
