<html>
<head>
    <title>Electronics Shop Inventory System</title>
</head>
<body>
    <h1>Electronics Shop Inventory System</h1>
    <h2>Product Registration Form</h2>
    <div>
        <form>
        <label>Product ID :</label><br>
        <input type="text" name="productid"><br><br>
        <label>Product Name :</label><br>
        <input type="text" name="productname"><br><br>
        <label>Brand :</label><br>
        <input type="text" name="brand"><br><br>
        <label>Category :</label><br>
        <input type="text" name="category"><br><br>
        <label>Price :</label><br>
        <input type="number" name="price"><br><br>
        <label>Quantity :</label><br>
        <input type="number" name="quantity"><br><br>
        <label>Supplier :</label><br>
        <input type="text" name="supplier"><br><br>
        <label>Product Image :</label><br>
        <input type="file" name="productimage"><br><br>
        <input type="submit" value="Register Product">
    </form>
    </div>
    <div>
        <h2>Inventory Report</h2>
    <table border="2">
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Brand</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Stock Status</th>
        </tr>
        <tr>
            <td>P001</td>
            <td>Laptop</td>
            <td>Dell</td>
            <td>55000</td>
            <td>10</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>P002</td>
            <td>Smartphone</td>
            <td>Samsung</td>
            <td>25000</td>
            <td>5</td>
            <td>Low Stock</td>
        </tr>
        <tr>
            <td>P003</td>
            <td>Headphones</td>
            <td>Sony</td>
            <td>3500</td>
            <td>0</td>
            <td>Out of Stock</td>
        </tr>
    </table>
    </div>
</body>
</html>
