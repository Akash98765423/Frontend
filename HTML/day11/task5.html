<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media tags</title>
</head>
<body>
    <h1>Media Tag</h1>
    <section>
        <div>
           <h3>Image</h3>
           <img src="assets/images/onepiece.jpg" alt="onepiece Image" width="600" height="300">
        </div>
        <div>
             <img src="assets/images/naruto.jpg" alt="onepiece Image" width="600" height="300">
        </div>
        <div>
            <img src="assets/images/solo.jpg" alt="solo leveling image" width="600" height="300">
        </div>
    </section>
    <section>
        <div>
            <h3>Audio</h3>
            <audio controls muted loop autoplay> 
                <source src="assets/audio/20060108040738-356.mp3" type="audio/mp3">
            </audio>
        </div>
    </section>
    <section>
        <div>
            <h3>Video</h3>
            <video controls poster="assets/images/doremon.jpg">
                <source src="assets/video/Doraemon title song in tamil.mp4" type="Video/mp4">
            </video>
        </div>
    </section>
    <section>
        <div>
            <h3>youtube & Map</h3>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/79o6jUxclPY?si=NbIlt8IcQlhnEOp7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.9635174977548!2d80.20188717405166!3d13.037994213421271!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a526752db8ffe35%3A0x7f6a2a2d0ebbdc94!2sSoftlogic!5e0!3m2!1sen!2sin!4v1785000538864!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </section>
    <section>
        <div>
            <h3>embedded pdf</h3>
             <iframe class="scribd_iframe_embed" title="Comments" src="https://www.scribd.com/embeds/487178045/content?start_page=1&view_mode=scroll&access_key=key-0gq8eEdPGGdVc5kR4lvw" tabindex="0" data-auto-height="true" data-aspect-ratio="0.7080062794348508" scrolling="no" width="600" height="300" frameborder="0" ></iframe>

</html>
