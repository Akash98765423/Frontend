<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <link rel="stylesheet" href="assets/css/task2.css">
</head>
<body>

    <h1>Product Cards</h1>

    <div class="container">

        <div class="card">
            <img src="../day5/assets/images/Bluetooth Speaker.jpg" alt="Product">
            <h2>Bluetooth Speaker</h2>
            <p class="price">₹599</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../day5/assets/images/Keyboard.jpg " alt="Product">
            <h2>Keyboard</h2>
            <p class="price">₹899</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../day5/assets/images/Headphones.jpg " alt="Product">
            <h2>Headphones</h2>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../day5/assets/images/watch.jpg" alt="Product">
            <h2>Smart Watch</h2>
            <p class="price">₹2,999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../day5/assets/images/Wireless Mouse.jpg" alt="Product">
            <h2>Wireless Mouse</h2>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../day5/assets/images/Power Bank.jpg" alt="Product">
            <h2>Power Bank</h2>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../day5/assets/images/watch.jpg" alt="Product">
            <h2>Watch</h2>
            <p class="price">₹499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../../BOOTSTRAP/day1/assets/img/laptop.webp" alt="Product">
            <h2>Laptop </h2>
            <p class="price">₹799</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
