<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>

    <link rel="stylesheet" href="assets/css/task3.css">
</head>
<body>

    <h1>Product Grid</h1>

    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/200?random=1" alt="Product 1">
            <h3>Wireless Headphones</h3>
            <p>₹2,499</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=2" alt="Product 2">
            <h3>Smart Watch</h3>
            <p>₹3,999</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=3" alt="Product 3">
            <h3>Bluetooth Speaker</h3>
            <p>₹1,799</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=4" alt="Product 4">
            <h3>Laptop Bag</h3>
            <p>₹1,299</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=5" alt="Product 5">
            <h3>Gaming Mouse</h3>
            <p>₹999</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=6" alt="Product 6">
            <h3>Keyboard</h3>
            <p>₹1,499</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=7" alt="Product 7">
            <h3>USB Hub</h3>
            <p>₹699</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200?random=8" alt="Product 8">
            <h3>Power Bank</h3>
            <p>₹1,899</p>
        </div>

    </div>

</body>
</html>
