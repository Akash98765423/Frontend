<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Lift Effect</title>
    <link rel="stylesheet" href="assets/css/task3.css">
</head>
<body>

    <h1>Product Cards</h1>

    <div class="container">

        <div class="card">
            <img src="https://picsum.photos/250/180?random=1" alt="Laptop">
            <h3>Laptop</h3>
            <p>₹45,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/180?random=2" alt="Smartphone">
            <h3>Smartphone</h3>
            <p>₹20,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/180?random=3" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹2,500</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/180?random=4" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>₹5,000</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
