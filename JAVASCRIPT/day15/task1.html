<!DOCTYPE html>
<html>
<head>
    <title>Show Hide Content</title>
    <style>
    .hidden {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.5s ease;
}

.show {
    background-color: black;
    color: white;
    opacity: 1;
    max-height: 100px;
    transition: all 0.5s ease;
}
    </style>
</head>
<body>

    <p id="content" class="hidden">
        This is the paragraph content.
    </p>

    <button id="toggleBtn">Show / Hide</button>

    <script src="assets/task1.js"></script>
</body>
</html>
