<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS - Flex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <header>
       <div class="d-flex justify-content-between align-items-center bg-secondary p-3">
         <div class="text-white">
            <h3>LOGO</h3>
        </div>
        <nav>
            <div class="d-flex gap-5 align-items-center">
                <a href="#" class="text-white text-decoration-none">Home</a>
                <a href="#" class="text-white text-decoration-none">About</a>
                <a href="#" class="text-white text-decoration-none">Serviced</a>
                <a href="#" class="text-white text-decoration-none">Help</a>
                <a href="#" class="text-white text-decoration-none">Contact</a>
                <button class="btn bg-info">Login</button>
            </div>
        </nav>
       </div>
    </header>

       <section class="m-4">
         <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/images/1.png" class="d-block w-100" alt="lion">
    </div>
    <div class="carousel-item">
      <img src="assets/images/2.png" class="d-block w-100" alt="tiger">
    </div>
    <div class="carousel-item">
      <img src="assets/images/3.png" class="d-block w-100" alt="panther">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
       </section>

       <section>
        <div class="container">
         <div class="row gap-3">
            <div class="card col bg-info rounded-3">
               <h1 class="card-title text-center pb-2">Shitzu Puppy</h1>
               <div class="card-img-top pb-2">
                  <img src="assets/images/shitzu.jpg" class="rounded-3" alt="shitzu" width="340">
               </div>
               <p class="text-center pb-2">Good friendly toy Shitzu puppy</p>
               <button type-buttom class="btn btn-danger ms-5 me-5">Buy</button>
            </div>

            <div class="card col bg-info rounded-3">
               <h1 class="card-title text-center pb-2">Pershien kitty</h1>
               <div class="card-img-top pb-2">
                  <img src="assets/images/cat.jpg" class="rounded-3" alt="shitzu" width="340">
               </div>
               <p class="text-center pb-2">Good friendly toy Pershien kitty</p>
               <button type-buttom class="btn btn-danger ms-5 me-5">Buy</button>
            </div>

            <div class="card col bg-info rounded-3">
               <h1 class="card-title text-center pb-2">Love Birds</h1>
               <div class="card-img-top pb-2">
                  <img src="assets/images/bird.jpg" class="rounded-3" alt="shitzu" width="340">
               </div>
               <p class="text-center pb-2">Good friendly love birds</p>
               <button type-buttom class="btn btn-danger ms-5 me-5">Buy</button>
            </div>
         </div>
        </div>
       </section>

       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
